<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="description" content="TSS • Syifa E'Shop • Syifa Printing ERP">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>TSS • SES • SP ERP</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#0f172a;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;background:#fff}
iframe{border:0;width:100%;height:100%;display:block;background:#fff}
#install{position:fixed;right:16px;bottom:16px;z-index:10;border:0;border-radius:999px;padding:12px 18px;background:#0f172a;color:#fff;font-weight:700;box-shadow:0 8px 28px rgba(0,0,0,.25);display:none}
#fallback{position:fixed;left:12px;right:12px;bottom:12px;z-index:9;background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 8px 30px rgba(0,0,0,.18);display:none;font-size:13px}
#fallback a{display:inline-block;margin-top:7px;font-weight:700;color:#0f172a}
</style>
</head>
<body>
<div id="app"><iframe id="erp" title="TSS SES SP ERP" src="https://script.google.com/macros/s/AKfycby8Piy30BFgFAw9xjNr74UErOPz88-90Txlz9lGUk4M4lDxTzfHRZgIkT_KQFIwn5RO/exec" allow="clipboard-read; clipboard-write"></iframe></div>
<button id="install" type="button">📲 Pasang ERP</button>
<div id="fallback">Jika ERP tidak muncul dalam bingkai, buka terus melalui pautan rasmi:<br><a id="direct" target="_blank" rel="noopener">Buka TSS • SES • SP ERP</a></div>
<script>
const ERP_URL='https://script.google.com/macros/s/AKfycby8Piy30BFgFAw9xjNr74UErOPz88-90Txlz9lGUk4M4lDxTzfHRZgIkT_KQFIwn5RO/exec';
document.getElementById('direct').href=ERP_URL;
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('install').style.display='block'});
document.getElementById('install').addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById('install').style.display='none'});
window.addEventListener('appinstalled',()=>{document.getElementById('install').style.display='none'});
setTimeout(()=>{const f=document.getElementById('fallback'); if(!document.hidden) f.style.display='none'},8000);
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
